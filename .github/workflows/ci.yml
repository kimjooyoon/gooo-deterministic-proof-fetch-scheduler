name: deterministic scheduler CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Run all validation and deterministic evidence in Actions
        shell: bash
        run: bash scripts/ci-evidence.sh
      - name: Verify the repository stayed write-free
        shell: bash
        run: test -z "$(git status --porcelain)"
      - name: Upload exact conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-proof-fetch-scheduler-conformance
          path: ${{ runner.temp }}/gooo-deterministic-proof-fetch-scheduler
          if-no-files-found: warn
